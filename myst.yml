# See docs at: https://mystmd.org/guide/frontmatter
version: 1
project:
  title: "k-space Explorer — Exploration interactive de l'espace des k"
  subtitle: TP2 — GBM8360E, du masquage au mouvement du patient
  authors:
    - name: DIONNET ELIOTT
      affiliations:
        - Polytechnique Montréal
  copyright: '2026'
  license: CC-BY-4.0
  open_access: true
  date: 2026-09-16
  keywords:
    - MRI
    - k-space
    - education

  numbering:
    headings: true

  # Les sigles ci-dessous sont reconnus automatiquement dans le texte (sans
  # accolades) : survolez-les pour voir leur définition.
  abbreviations:
    MRI: Imagerie par résonance magnétique (magnetic resonance imaging)
    IRM: Imagerie par résonance magnétique
    TR: Temps de répétition (repetition time)
    TE: Temps d'écho (echo time)
    FOV: Champ de vue (field of view)
    PE: Encodage de phase (phase encode)
    RO: Lecture (readout)
    FFT: Transformée de Fourier rapide (fast Fourier transform)
    DFT: Transformée de Fourier discrète (discrete Fourier transform)
    SNR: Rapport signal sur bruit (signal-to-noise ratio)
    PSF: Fonction d'étalement du point (point spread function)
    NUFFT: Transformée de Fourier non uniforme (non-uniform FFT)
    SENSE: Sensitivity encoding (imagerie parallèle)
    SPGR: Spoiled gradient echo (écho de gradient déphasé)

  bibliography:
    - bibliography/references.bib

  exclude:
    - README.md

  # Copie le dossier figures/ (pages HTML interactives generees par les
  # notebooks pendant le build) tel quel dans le site construit, pour la
  # directive {iframe}. Verifie : la copie a lieu apres l'execution des
  # notebooks, donc fonctionne aussi sur un clone frais (CI).
  static_files:
    - figures

  # Une seule source, plusieurs sorties. La version PDF (typst) est optionnelle
  # pour ce TP mais gratuite à avoir : gardez `articles` synchronisé avec `toc`.
  exports:
    - format: typst
      template: plain_typst_book
      output: exports/my-myst-book.pdf
      articles:
        - file: index.md
        - file: 01-masquage.md
        - file: 02-sous-echantillonnage.md
        - file: 03-mouvement.md

  toc:
    - file: index.md
    - file: 01-masquage.md
    - file: 02-sous-echantillonnage.md
    - file: 03-mouvement.md
    # Les notebooks DOIVENT etre dans ce toc (pas juste presents dans le dossier) :
    # c'est ce qui declenche leur execution par MyST au moment du build. Sans ca,
    # sur un clone frais (ex. CI GitHub Actions) ou figures/ n'existe pas encore,
    # MyST ne sait jamais qu'il doit executer ces notebooks, et figures/fig-*.html
    # n'est donc jamais genere -> iframe casse en permanence sur le site publie.
    # (Verifie experimentalement : hors du toc, aucune tentative d'execution ;
    # dans le toc, MyST tente "Executing notebook ...".)
    - title: Notebooks (code des figures)
      children:
        - file: notebooks/00-intro-log.ipynb
        - file: notebooks/01-masquage.ipynb
        - file: notebooks/02-sous-echantillonnage.ipynb
        - file: notebooks/03-mouvement.ipynb

site:
  template: book-theme
  options:
    logo_text: k-space Explorer
    # Feuille de style qui donne aux figures interactives une hauteur adaptee
    # a leur largeur (voir styles/figures.css).
    style: styles/figures.css
  actions:
    - title: Source on GitHub
      url: https://github.com/GBM8360/lab2-eliottdionnet
